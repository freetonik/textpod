<!DOCTYPE html>
<html>

<head>
    <title>Textpod</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="shortcut icon" href="{{FAVICON}}" />
    <style>
        @media (prefers-color-scheme: light) {
            :root {
                --color-secondary: #666;
                --color-text-secondary: white;
                --color-bg-secondary: #dedcd1;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-secondary: #BBB;
                --color-text-secondary: black;
                --color-bg-secondary: #3a3a3a;
            }
        }

        html {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        #editor {
            width: 100%;
            height: 200px;
            font-family: monospace;
            padding: 1em;
            resize: vertical;
            box-sizing: border-box
        }

        #submitContainer {
            margin-bottom: 1.5em;
            text-align: right;
        }

        #submitButton {
            font-family: monospace;
            padding: 0.4em 1em;
            background-color: var(--color-secondary);
            color: var(--color-text-secondary);
            border: none;
            cursor: pointer;
        }

        .note> :first-child {
            margin-top: 0;
        }

        .note> :nth-last-child(2) {
            margin-bottom: 0.5em;
        }

        .note {
            margin-bottom: 1.75em;
            padding-top: 0.25em;
        }

        .note .noteMetadata {
            font-size: 0.9em;
            font-family: monospace;
            color: var(--color-secondary);
        }

        .note .noteMetadata a {
            color: var(--color-secondary);
            text-decoration: none;
        }

        .note .noteMetadata a:hover {
            text-decoration: underline;
        }

        .note code {
            padding: 0.25em;
            background-color: var(--color-bg-secondary);
        }

        .note pre {
            padding: 0.5em;
            background-color: var(--color-bg-secondary);
        }

        .note pre code {
            padding: 0;
            background-color: transparent;
        }

        .note img,
        .note iframe,
        .note video,
        .note audio,
        .note embed,
        .note svg {
            max-width: 100%;
        }
        .tag{display:inline-block;margin-right:0.4em;padding:0.2em 0.5em;border-radius:4px;border:1px solid var(--color-bg-secondary);background:transparent;cursor:pointer}
        .tag.active{background:var(--color-bg-secondary)}
    </style>
</head>

<body>

    <textarea id="editor"
        placeholder="Ctrl+Enter to save.&#10;Type / to search.&#10;Drag & drop files to attach.&#10;Start links with + to save local copies."></textarea>
    <div id="submitContainer"><button id="submitButton">Submit</button></div>
    <input id="tagsInput" placeholder="tags (comma separated)" style="width:100%;margin:0.5em 0;padding:0.4em;font-family:monospace;box-sizing:border-box">
    <div id="tagPicker" style="margin-bottom:1em"></div>
    <div id="notes"></div>

    <script>
        const editor = document.getElementById('editor');
        const notesDiv = document.getElementById('notes');
        const tagPicker = document.getElementById('tagPicker');
        const submitButton = document.getElementById('submitButton');
        const tagsInput = document.getElementById('tagsInput');
        let searchTimeout = null;

        window.addEventListener('load', async () => {
            displayNotes();
        });

        // fetches and displays all notes, optionally filtering them based on the query parameter `q`
        async function displayNotes() {
            const params = new URLSearchParams(window.location.search);
            const searchQuery = params.get('q');
            const tagQuery = params.get('tag');
            let response = await fetch('/notes');
            if (response.ok) {
                const notes = await response.json();

                // Build tag picker from notes
                const tagCounts = {};
                notes.forEach(n => {
                    if (Array.isArray(n.tags)) {
                        n.tags.forEach(t => {
                            tagCounts[t] = (tagCounts[t] || 0) + 1;
                        })
                    }
                });

                // render tag picker
                const tags = Object.keys(tagCounts).sort((a,b)=> tagCounts[b]-tagCounts[a]);
                tagPicker.innerHTML = '';
                if (tags.length > 0) {
                    const clearBtn = document.createElement('button');
                    clearBtn.textContent = 'All';
                    clearBtn.className = 'tag' + (tagQuery ? '' : ' active');
                    clearBtn.onclick = () => setTag(null);
                    tagPicker.appendChild(clearBtn);
                    tags.forEach(t => {
                        const b = document.createElement('button');
                        b.textContent = `#${t} (${tagCounts[t]})`;
                        b.className = 'tag' + (tagQuery === t ? ' active' : '');
                        b.onclick = () => setTag(t);
                        tagPicker.appendChild(b);
                    });
                }

                // filter notes client-side by search query and tag
                const filtered = notes
                    .filter(note => !searchQuery || note.content.toLowerCase().includes(searchQuery.toLowerCase()))
                    .filter(note => !tagQuery || (Array.isArray(note.tags) && note.tags.map(x=>x.toLowerCase()).includes(tagQuery.toLowerCase())));

                notesDiv.innerHTML = filtered
                    .map((note, i) => `
                    <div class="note">
                        ${note.html}
                        <div class="noteMetadata">
                            <time datetime="${note.timestamp}">${note.timestamp}</time>
                            [<a href="#" onclick="deleteNote(${i})">delete</a>]
                        </div>
                    </div>`)
                    .reverse()
                    .join('');
            }
        }

        function setTag(tag) {
            const newUrl = tag ? `${window.location.pathname}?tag=${encodeURIComponent(tag)}` : window.location.pathname;
            window.history.replaceState({}, '', newUrl);
            displayNotes();
        }

        // saves a new note and refreshes the page
        async function saveNotes() {
            if (!editor.value) {
                return;
            }

            // collect tags from tagsInput (comma separated)
            const rawTags = (tagsInput && tagsInput.value) ? tagsInput.value.split(',').map(t=>t.trim()).filter(Boolean) : [];
            let contentToSave = editor.value;
            if (rawTags.length > 0) {
                const tagString = rawTags.map(t => `#${t.replace(/[^A-Za-z0-9_-]/g,'')}`).join(' ');
                contentToSave = `${contentToSave}\n\n${tagString}`;
            }

            const saveResponse = await fetch('/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(contentToSave)
            });

            // Clear inputs and refresh when saved
            if (saveResponse.ok) {
                editor.value = '';
                if (tagsInput) tagsInput.value = '';
                displayNotes();
            } else if (saveResponse.status === 405) {
                alert('Server is running in read-only mode.');
            }
        }

        // deletes note with index `idx`
        async function deleteNote(idx) {
            event.preventDefault();
            if (!confirm('Are you sure you want to delete this note?')) {
                return;
            }

            deleteResponse = await fetch(`/notes/${idx}`, {
                method: 'DELETE'
            });

            if (deleteResponse.ok) {
                displayNotes();
            } else {
                alert('Failed to delete note');
            }
        }

        editor.addEventListener('input', async (e) => {
            const text = editor.value;
            if (text.startsWith('/')) {
                if (searchTimeout) {
                    clearTimeout(searchTimeout);
                }
                searchTimeout = setTimeout(async () => {
                    const query = text.slice(1);
                    // Update URL with search parameter
                    const newUrl = query
                        ? `${window.location.pathname}?q=${encodeURIComponent(query)}`
                        : window.location.pathname;
                    window.history.replaceState({}, '', newUrl);

                    displayNotes();
                }, 200);
            } else if (text === '') {
                // Clear search parameter from URL
                window.history.replaceState({}, '', window.location.pathname);
                displayNotes();
            }
        });

        editor.addEventListener('keydown', async (e) => {
            if (e.ctrlKey && e.key === 'Enter' && !editor.value.startsWith('/')) {
                saveNotes();
            }
        });

        submitButton.addEventListener('click', async (e) => {
            saveNotes();
        })

        editor.addEventListener('paste', (e) => {
            console.log(e);
        });

        editor.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        editor.addEventListener('drop', async (e) => {
            e.preventDefault();

            const files = e.dataTransfer.files;
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const path = await response.json();
                    const filename = path.split('/').pop();

                    const position = editor.selectionStart;
                    const before = editor.value.substring(0, position);
                    const after = editor.value.substring(position);

                    // Link path with spaces needs to be wrapped in < >, Commonmark spec apparently handles this
                    const needsBrackets = path.includes(' ') || filename.includes(' ');
                    const formattedPath = needsBrackets ? `<${path}>` : path;

                    if (file.type.startsWith('image/')) {
                        editor.value = `${before}![${filename}](${formattedPath})${after}`;
                    } else {
                        editor.value = `${before}[${filename}](${formattedPath})${after}`;
                    }
                }
            }
        });


    </script>
</body>

</html>
